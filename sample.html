<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流式时间统计 (TimeFlow)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* 模拟手机外壳的阴影 */
        .mobile-frame {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-200 p-4">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 简单的 SVG 图标组件 (避免依赖外部库加载失败) ---
        const Icons = {
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.39a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            ChevronRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            Tag: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        };

        const DEFAULT_TAGS = [
            { id: '1', label: '工作', color: 'bg-blue-100 text-blue-800' },
            { id: '2', label: '学习', color: 'bg-purple-100 text-purple-800' },
            { id: '3', label: '休息', color: 'bg-green-100 text-green-800' },
            { id: '4', label: '通勤', color: 'bg-orange-100 text-orange-800' },
            { id: '5', label: '运动', color: 'bg-red-100 text-red-800' },
        ];

        function App() {
            const [logs, setLogs] = useState([]);
            const [lastLogTime, setLastLogTime] = useState(new Date());
            const [elapsedSeconds, setElapsedSeconds] = useState(0);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [pendingDuration, setPendingDuration] = useState(0);
            const [pendingEndTime, setPendingEndTime] = useState(null);
            
            const [description, setDescription] = useState('');
            const [selectedTags, setSelectedTags] = useState([]);
            const [customTagInput, setCustomTagInput] = useState('');

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    const diffInSeconds = Math.floor((now.getTime() - lastLogTime.getTime()) / 1000);
                    setElapsedSeconds(diffInSeconds);
                }, 1000);
                return () => clearInterval(timer);
            }, [lastLogTime]);

            const formatTime = (date) => date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const formatDuration = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                if (h > 0) return `${h}h ${m}m`;
                return `${m}m ${s}s`;
            };
            const formatTotalForHeader = () => {
                const totalSeconds = logs.reduce((acc, log) => acc + log.durationSeconds, 0);
                const h = Math.floor(totalSeconds / 3600);
                const m = Math.floor((totalSeconds % 3600) / 60);
                return `${h}h ${m}m`;
            };

            const handleLogClick = () => {
                const now = new Date();
                setPendingEndTime(now);
                setPendingDuration(elapsedSeconds);
                setIsModalOpen(true);
            };

            const handleSaveLog = () => {
                if (!pendingEndTime) return;
                const newLog = {
                    id: Date.now().toString(),
                    startTime: lastLogTime,
                    endTime: pendingEndTime,
                    durationSeconds: pendingDuration,
                    description: description || '未命名活动',
                    tags: selectedTags.length > 0 ? selectedTags : ['未分类'],
                };
                setLogs([newLog, ...logs]);
                setLastLogTime(pendingEndTime);
                setDescription('');
                setSelectedTags([]);
                setIsModalOpen(false);
            };

            const toggleTag = (tagLabel) => {
                if (selectedTags.includes(tagLabel)) {
                    setSelectedTags(selectedTags.filter(t => t !== tagLabel));
                } else {
                    setSelectedTags([...selectedTags, tagLabel]);
                }
            };
             const handleAddCustomTag = () => {
                if (customTagInput.trim()) {
                    toggleTag(customTagInput.trim());
                    setCustomTagInput('');
                }
            };

            return (
                <div className="w-full max-w-[400px] h-[850px] bg-white rounded-[40px] overflow-hidden mobile-frame flex flex-col relative border-8 border-gray-900">
                    
                    {/* Header */}
                    <header className="px-6 py-6 bg-white/90 backdrop-blur-md flex justify-between items-center sticky top-0 z-10 border-b border-gray-100">
                        <div>
                            <h1 className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">今日统计</h1>
                            <div className="text-3xl font-bold text-gray-800 flex items-baseline gap-2">
                                {formatTotalForHeader()}
                            </div>
                        </div>
                        <button className="p-2 text-gray-400 hover:bg-gray-100 rounded-full transition">
                            <Icons.Settings />
                        </button>
                    </header>

                    {/* Timeline List */}
                    <main className="flex-1 overflow-y-auto p-4 space-y-4 pb-32 bg-gray-50/50">
                        {logs.length === 0 ? (
                            <div className="flex flex-col items-center justify-center h-64 text-gray-400 space-y-3">
                                <div className="p-4 bg-gray-100 rounded-full">
                                    <Icons.Clock />
                                </div>
                                <p className="text-sm">点击底部按钮，记录你的第一个活动</p>
                            </div>
                        ) : (
                            logs.map((log) => (
                                <div key={log.id} className="flex gap-3 group animate-in slide-in-from-bottom-2 duration-300">
                                    <div className="flex flex-col items-end min-w-[50px] pt-2">
                                        <span className="text-[10px] font-mono font-medium text-gray-400">{formatTime(log.endTime)}</span>
                                        <div className="h-full w-[2px] bg-gray-200 my-1 mx-auto relative rounded-full"></div>
                                    </div>

                                    <div className="flex-1 bg-white p-4 rounded-2xl border border-gray-100 shadow-[0_2px_8px_rgba(0,0,0,0.04)] flex justify-between items-start">
                                        <div className="space-y-2">
                                            <div className="font-semibold text-gray-800 leading-none">{log.description}</div>
                                            <div className="flex flex-wrap gap-1">
                                                {log.tags.map(tag => (
                                                    <span key={tag} className="text-[10px] px-2 py-0.5 rounded-md bg-gray-100 text-gray-500 font-medium">
                                                        #{tag}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="text-right pl-2">
                                            <div className="font-mono font-bold text-blue-600 text-lg leading-none mb-1">{formatDuration(log.durationSeconds)}</div>
                                            <div className="text-[10px] text-gray-400">{formatTime(log.startTime)} - {formatTime(log.endTime)}</div>
                                        </div>
                                    </div>
                                </div>
                            ))
                        )}
                    </main>

                    {/* Bottom Sticky Action Area */}
                    <div className="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-white via-white to-transparent pt-10">
                        <div className="flex justify-between items-end mb-4 px-2">
                            <div>
                                <span className="text-xs font-medium text-gray-400 uppercase tracking-wider">正在进行</span>
                                <div className="text-4xl font-mono font-bold text-gray-900 mt-1 tabular-nums tracking-tight">
                                    {formatDuration(elapsedSeconds)}
                                </div>
                            </div>
                            <div className="text-xs text-gray-400 font-medium pb-1">
                                开始于 {formatTime(lastLogTime)}
                            </div>
                        </div>

                        <button 
                            onClick={handleLogClick}
                            className="w-full bg-black text-white h-16 rounded-2xl font-bold text-lg shadow-xl hover:bg-gray-800 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2 group"
                        >
                            <span className="group-hover:translate-x-1 transition-transform">记录并切换</span>
                            <Icons.ChevronRight />
                        </button>
                    </div>

                    {/* Modal */}
                    {isModalOpen && (
                        <div className="absolute inset-0 z-50 flex items-end bg-black/40 backdrop-blur-[2px]">
                            <div className="bg-white w-full rounded-t-[32px] p-6 shadow-2xl animate-in slide-in-from-bottom-full duration-300">
                                <div className="flex justify-between items-center mb-6">
                                    <div>
                                        <p className="text-xs text-gray-400 uppercase font-bold">刚刚完成了</p>
                                        <h2 className="text-3xl font-mono font-bold text-blue-600 mt-1">{formatDuration(pendingDuration)}</h2>
                                    </div>
                                    <button onClick={() => setIsModalOpen(false)} className="p-2 bg-gray-100 rounded-full hover:bg-gray-200">
                                        <Icons.X />
                                    </button>
                                </div>

                                <div className="space-y-5">
                                    <div>
                                        <input 
                                            type="text" 
                                            value={description}
                                            onChange={(e) => setDescription(e.target.value)}
                                            placeholder="刚才做了什么？"
                                            autoFocus
                                            className="w-full text-xl font-medium border-b-2 border-gray-100 focus:border-black outline-none py-2 bg-transparent placeholder:text-gray-300"
                                        />
                                    </div>

                                    <div>
                                        <div className="flex flex-wrap gap-2 mb-3">
                                            {DEFAULT_TAGS.map(tag => (
                                                <button
                                                    key={tag.id}
                                                    onClick={() => toggleTag(tag.label)}
                                                    className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${
                                                        selectedTags.includes(tag.label) 
                                                            ? 'bg-black text-white shadow-lg scale-105' 
                                                            : 'bg-gray-100 text-gray-500 hover:bg-gray-200'
                                                    }`}
                                                >
                                                    {tag.label}
                                                </button>
                                            ))}
                                        </div>
                                         <div className="flex items-center gap-2 bg-gray-50 rounded-xl px-3 py-2">
                                            <Icons.Tag />
                                            <input 
                                                type="text"
                                                value={customTagInput}
                                                onChange={(e) => setCustomTagInput(e.target.value)}
                                                onKeyDown={(e) => e.key === 'Enter' && handleAddCustomTag()}
                                                placeholder="输入新标签..."
                                                className="bg-transparent text-sm w-full outline-none"
                                            />
                                            {customTagInput && <button onClick={handleAddCustomTag}><Icons.Plus /></button>}
                                        </div>
                                    </div>

                                    <button 
                                        onClick={handleSaveLog}
                                        className="w-full bg-blue-600 text-white h-14 rounded-xl font-bold text-lg shadow-lg shadow-blue-200 hover:bg-blue-700 active:scale-[0.98] transition-all mt-2"
                                    >
                                        保存
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
